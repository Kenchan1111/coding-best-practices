# Reproducible Conda environment for the coding-best-practices skill.
# Security discipline:
# - use conda-forge through Conda metadata, not curl|sh installers
# - keep Bun isolated from base
# - prefer the explicit lock for exact Linux reproduction
name: coding-best-practices
channels:
  - conda-forge
dependencies:
  - bun=1.3.11
  - nodejs>=22,<23
  - python>=3.13,<3.14
